      body {
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6;

      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      
      /* Highlight classes for Prompt Engineering Lab */
      .highlight-context { background-color: #fef08a; border-bottom: 2px solid #eab308; } /* Yellow */
      .highlight-role { background-color: #bbf7d0; border-bottom: 2px solid #22c55e; } /* Green */
      .highlight-action { background-color: #bfdbfe; border-bottom: 2px solid #3b82f6; } /* Blue */
      .highlight-format { background-color: #fecaca; border-bottom: 2px solid #ef4444; } /* Red */
      .highlight-tone { background-color: #e9d5ff; border-bottom: 2px solid #a855f7; } /* Purple */
    </style>
